{% load static %}

<style>
    :root {
        --primary-blue: #005494;
        --secondary-blue: #0066cc;
        --dark-gray: #333;
        --light-gray: #f8f9fa;
        --white: #ffffff;
        --shadow-light: rgba(0, 84, 148, 0.1);
        --shadow-medium: rgba(0, 84, 148, 0.2);
        --shadow-dark: rgba(0, 84, 148, 0.3);
    }

    /* Reset and base styles */
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding-top: 80px; /* Account for fixed navbar */
    }

    /* Navbar Styles */
    .navbar-custom {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-bottom: 1px solid var(--shadow-light);
        box-shadow: 0 2px 20px var(--shadow-light);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1030;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        padding: 15px 0;
        min-height: 80px;
    }

    .navbar-custom.scrolled {
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 4px 30px var(--shadow-medium);
        padding: 12px 0;
    }

    /* Brand Logo */
    .navbar-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        transition: all 0.3s ease;
    }

    .navbar-brand img {
        height: 48px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        filter: drop-shadow(0 2px 4px var(--shadow-light));
    }

    .navbar-brand:hover img {
        transform: scale(1.05);
        filter: drop-shadow(0 4px 8px var(--shadow-medium));
    }

    /* Main Navigation Links */
    .navbar-nav .nav-link {
        color: var(--primary-blue) !important;
        font-weight: 600;
        font-size: 16px;
        padding: 14px 24px !important;
        border-radius: 30px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        margin: 0 8px;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .navbar-nav .nav-link:hover {
        background: linear-gradient(135deg, var(--shadow-light), rgba(0, 84, 148, 0.05));
        transform: translateY(-2px);
        box-shadow: 0 6px 20px var(--shadow-light);
    }

    .navbar-nav .nav-link.active {
        background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
        color: white !important;
        box-shadow: 0 4px 15px var(--shadow-medium);
    }

    .navbar-nav .nav-link.active:hover {
        background: linear-gradient(135deg, var(--secondary-blue), var(--primary-blue));
        transform: translateY(-2px);
        box-shadow: 0 6px 25px var(--shadow-dark);
    }

    /* Enhanced Notification Bell */
    .notification-bell {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        border-radius: 50%;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        color: var(--primary-blue);
        font-size: 20px;
        background: rgba(0, 84, 148, 0.03);
        border: 2px solid transparent;
        text-decoration: none;
        margin: 0 8px;
        width: 52px;
        height: 52px;
    }

    .notification-bell:hover {
        background: rgba(0, 84, 148, 0.08);
        border-color: var(--shadow-light);
        transform: scale(1.1);
        color: var(--secondary-blue);
        box-shadow: 0 6px 20px var(--shadow-light);
    }

    .notification-bell .fa-bell {
        transition: all 0.3s ease;
    }

    .notification-bell:hover .fa-bell {
        animation: bellRing 0.6s ease;
    }

    @keyframes bellRing {
        0%, 100% { transform: rotate(0deg); }
        10%, 30%, 50%, 70%, 90% { transform: rotate(15deg); }
        20%, 40%, 60%, 80% { transform: rotate(-15deg); }
    }

    /* Enhanced Notification Badge */
    .notification-badge {
        position: absolute;
        top: 2px;
        right: 2px;
        background: linear-gradient(135deg, #ff6b35, #ff8c42);
        color: white;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        font-size: 11px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: badgePulse 2s infinite;
        border: 3px solid white;
        box-shadow: 0 2px 10px rgba(255, 107, 53, 0.4);
    }

    @keyframes badgePulse {
        0% { transform: scale(1); box-shadow: 0 2px 10px rgba(255, 107, 53, 0.4); }
        50% { transform: scale(1.1); box-shadow: 0 4px 15px rgba(255, 107, 53, 0.6); }
        100% { transform: scale(1); box-shadow: 0 2px 10px rgba(255, 107, 53, 0.4); }
    }

    /* Enhanced Profile Section */
    .profile-section {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 18px;
        border-radius: 30px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        text-decoration: none;
        color: var(--dark-gray);
        background: rgba(0, 84, 148, 0.03);
        border: 2px solid transparent;
        margin: 0 8px;
        min-width: 160px;
    }

    .profile-section:hover {
        background: rgba(0, 84, 148, 0.08);
        border-color: var(--shadow-light);
        transform: translateY(-2px);
        color: var(--primary-blue);
        text-decoration: none;
        box-shadow: 0 6px 20px var(--shadow-light);
    }

    .profile-img {
        width: 38px;
        height: 38px;
        border: 3px solid var(--primary-blue);
        border-radius: 50%;
        object-fit: cover;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 2px 8px var(--shadow-light);
    }

    .profile-img:hover {
        border-color: var(--secondary-blue);
        transform: scale(1.1);
        box-shadow: 0 4px 12px var(--shadow-medium);
    }

    .profile-username {
        font-weight: 600;
        font-size: 15px;
        color: var(--primary-blue);
        transition: all 0.3s ease;
    }

    .profile-section:hover .profile-username {
        color: var(--secondary-blue);
    }

    .profile-dropdown-arrow {
        font-size: 12px;
        color: var(--primary-blue);
        transition: all 0.3s ease;
    }

    .profile-section:hover .profile-dropdown-arrow {
        color: var(--secondary-blue);
        transform: rotate(180deg);
    }

    /* Enhanced Dropdown Menu */
    .dropdown-menu-custom {
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: none;
        border-radius: 20px;
        box-shadow: 0 15px 40px var(--shadow-medium);
        padding: 20px 0;
        margin-top: 15px;
        min-width: 300px;
        max-height: 400px;
        overflow-y: auto;
        border: 1px solid var(--shadow-light);
    }

    .dropdown-item-custom {
        padding: 15px 25px;
        border-radius: 12px;
        margin: 5px 15px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--dark-gray);
        text-decoration: none;
        font-weight: 500;
    }

    .dropdown-item-custom:hover {
        background: rgba(0, 84, 148, 0.08);
        transform: translateX(8px);
        color: var(--primary-blue);
        text-decoration: none;
        box-shadow: 0 4px 15px var(--shadow-light);
    }

    .dropdown-item-custom.logout-item {
        color: #dc3545;
        margin-top: 15px;
    }

    .dropdown-item-custom.logout-item:hover {
        background: rgba(220, 53, 69, 0.08);
        color: #dc3545;
    }

    /* Dropdown Header */
    .dropdown-header-custom {
        padding: 10px 25px 15px;
        color: var(--primary-blue);
        font-size: 16px;
        font-weight: 700;
        border-bottom: 2px solid var(--shadow-light);
        margin-bottom: 10px;
    }

    /* Navbar Toggler */
    .navbar-toggler {
        border: none;
        padding: 12px 15px;
        border-radius: 12px;
        background: rgba(0, 84, 148, 0.08);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 2px 10px var(--shadow-light);
        position: relative;
        overflow: hidden;
    }

    .navbar-toggler:hover {
        background: rgba(0, 84, 148, 0.15);
        transform: scale(1.05);
        box-shadow: 0 4px 15px var(--shadow-medium);
    }

    .navbar-toggler:focus {
        box-shadow: 0 0 0 3px var(--shadow-light);
    }

    .navbar-toggler-icon {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='%23005494' stroke-linecap='round' stroke-miterlimit='10' stroke-width='3' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        width: 24px;
        height: 24px;
        transition: all 0.3s ease;
    }

    /* Notification Items */
    .notification-item {
        padding: 18px 25px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        border-radius: 10px;
        margin: 3px 15px;
    }

    .notification-item:hover {
        background: rgba(0, 84, 148, 0.05);
        transform: translateX(8px);
        box-shadow: 0 2px 10px var(--shadow-light);
    }

    .notification-item.unread {
        background: rgba(0, 84, 148, 0.08);
        border-left: 4px solid var(--primary-blue);
    }

    /* Mobile Responsive */
    @media (max-width: 991px) {
        body {
            padding-top: 70px;
        }
        
        .navbar-custom {
            padding: 10px 0;
            min-height: 70px;
        }
        
        .navbar-brand img {
            height: 40px;
        }
        
        /* Mobile collapsed menu styling */
        .navbar-collapse {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            margin-top: 20px;
            padding: 25px 20px;
            box-shadow: 0 15px 40px var(--shadow-medium);
            border: 1px solid var(--shadow-light);
        }
        
        /* Main nav links in mobile */
        .navbar-nav:first-child {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 2px solid var(--shadow-light);
        }
        
        .navbar-nav .nav-link {
            padding: 18px 25px !important;
            margin: 8px 0;
            border-radius: 15px;
            font-size: 16px;
            text-align: center;
            justify-content: center;
        }
        
        /* Right side nav in mobile - Stack vertically */
        .navbar-nav.ms-auto {
            flex-direction: column !important;
            align-items: center;
            gap: 15px;
            width: 100%;
        }
        
        .navbar-nav.ms-auto .nav-item {
            display: flex;
            justify-content: center;
            width: 100%;
        }
        
        /* Notification bell in mobile */
        .notification-bell {
            font-size: 22px;
            padding: 18px;
            width: 58px;
            height: 58px;
            margin: 0 auto;
        }
        
        .notification-badge {
            width: 22px;
            height: 22px;
            font-size: 10px;
            top: 4px;
            right: 4px;
        }
        
        /* Profile section in mobile */
        .profile-section {
            flex-direction: row;
            gap: 12px;
            padding: 15px 20px;
            justify-content: center;
            width: 100%;
            max-width: 300px;
            border-radius: 25px;
            margin: 0 auto;
        }
        
        .profile-img {
            width: 36px;
            height: 36px;
        }
        
        .profile-username {
            font-size: 14px;
        }
        
        /* Fix dropdown positioning for mobile */
        .dropdown-menu-custom {
            min-width: 280px;
            max-width: 90vw;
            position: absolute !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            right: auto !important;
            margin-top: 10px;
        }
        
        /* Force dropdown to center on mobile */
        .navbar-nav.ms-auto .dropdown {
            position: static;
        }
        
        .navbar-nav.ms-auto .dropdown .dropdown-menu {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            right: auto;
        }
    }
    
    /* Extra small screens */
    @media (max-width: 575px) {
        .navbar-custom {
            padding: 8px 0;
            min-height: 65px;
        }
        
        body {
            padding-top: 65px;
        }
        
        .navbar-brand img {
            height: 35px;
        }
        
        .container {
            padding: 0 15px;
        }
        
        /* Stack elements vertically with more space */
        .navbar-nav.ms-auto {
            gap: 20px;
        }
        
        .profile-section {
            max-width: 250px;
            padding: 12px 16px;
        }
        
        .profile-img {
            width: 32px;
            height: 32px;
        }
        
        .profile-username {
            font-size: 13px;
        }
        
        .notification-bell {
            font-size: 20px;
            padding: 15px;
            width: 52px;
            height: 52px;
        }
        
        .dropdown-menu-custom {
            min-width: 260px;
            max-width: 85vw;
        }
        
        .navbar-collapse {
            padding: 20px 15px;
        }
        
        .navbar-nav .nav-link {
            padding: 15px 20px !important;
            margin: 5px 0;
        }
    }

    /* Very small screens */
    @media (max-width: 400px) {
        .profile-username {
            font-size: 12px;
        }
        
        .profile-section {
            max-width: 200px;
            padding: 10px 12px;
        }
        
        .notification-bell {
            padding: 12px;
            width: 48px;
            height: 48px;
        }
        
        .dropdown-menu-custom {
            min-width: 240px;
            max-width: 80vw;
        }
        
        .navbar-nav.ms-auto {
            gap: 15px;
        }
    }

    /* Custom scrollbar for dropdown */
    .dropdown-menu-custom::-webkit-scrollbar {
        width: 6px;
    }

    .dropdown-menu-custom::-webkit-scrollbar-track {
        background: rgba(0, 84, 148, 0.1);
        border-radius: 10px;
    }

    .dropdown-menu-custom::-webkit-scrollbar-thumb {
        background: var(--primary-blue);
        border-radius: 10px;
    }

    .dropdown-menu-custom::-webkit-scrollbar-thumb:hover {
        background: var(--secondary-blue);
    }
</style>

            </ul>
        </div>
    </div>
</nav>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Enhanced navbar scroll effect
    let scrollTimeout;
    window.addEventListener('scroll', function() {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(function() {
            const navbar = document.querySelector('.navbar-custom');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        }, 10);
    });

    // Notification system with improved performance
    function setupWebSocket() {
        const notifySocket = new WebSocket(
            'ws://' + window.location.host + '/ws/notify/'
        );

        notifySocket.onopen = function (e) {
            console.log('Notification socket connected');
        };

        notifySocket.onclose = function (e) {
            console.log('Notification socket closed, attempting to reconnect...');
            setTimeout(function() {
                setupWebSocket();
            }, 5000);
        };

        notifySocket.onmessage = function (e) {
            const data = JSON.parse(e.data);
            addNotification(data.message, false);
        };
    }

    function addNotification(message, isRead, notificationId) {
        const notifyContainer = document.getElementById('notify');
        const bellCount = document.getElementById('bellCount');
        
        // Remove "no notifications" message if present
        const noNotifications = notifyContainer.querySelector('.text-muted');
        if (noNotifications && noNotifications.parentElement) {
            noNotifications.parentElement.remove();
        }

        // Create notification element
        const notificationElement = document.createElement('li');
        notificationElement.className = `notification-item ${!isRead ? 'unread' : ''}`;
        notificationElement.innerHTML = `
            <div class="d-flex justify-content-between align-items-start">
                <div class="flex-grow-1">
                    <div class="fw-semibold mb-1">${message}</div>
                    <small class="text-muted">${new Date().toLocaleTimeString()}</small>
                </div>
                ${!isRead ? '<div class="badge bg-primary rounded-pill ms-2">New</div>' : ''}
            </div>
        `;

        // Add click handler to mark as read
        notificationElement.addEventListener('click', function() {
            if (notificationId && !isRead) {
                markNotificationAsRead(notificationId, notificationElement);
            }
        });

        notifyContainer.appendChild(notificationElement);

        // Update badge count with animation
        if (!isRead) {
            const currentCount = parseInt(bellCount.textContent) || 0;
            const newCount = currentCount + 1;
            bellCount.textContent = newCount;
            bellCount.style.display = newCount > 0 ? 'flex' : 'none';
        }
    }

    function markNotificationAsRead(notificationId, element) {
        fetch(`/chat/api/notifications/${notificationId}/read/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            }
        }).then(response => {
            if (response.ok) {
                element.classList.remove('unread');
                const badge = element.querySelector('.badge');
                if (badge) {
                    badge.remove();
                }
                
                // Update badge count
                const bellCount = document.getElementById('bellCount');
                const currentCount = parseInt(bellCount.textContent) || 0;
                const newCount = Math.max(0, currentCount - 1);
                bellCount.textContent = newCount;
                bellCount.style.display = newCount > 0 ? 'flex' : 'none';
            }
        }).catch(error => {
            console.error('Error marking notification as read:', error);
        });
    }

    function fetchNotifications() {
        fetch('/chat/api/notifications/')
            .then(response => response.json())
            .then(data => {
                const unreadCount = data.filter(n => !n.read).length;
                const bellCount = document.getElementById('bellCount');
                bellCount.textContent = unreadCount;
                bellCount.style.display = unreadCount > 0 ? 'flex' : 'none';
                
                data.forEach(notification => {
                    addNotification(notification.message, notification.read, notification.id);
                });
            })
            .catch(error => console.error('Error fetching notifications:', error));
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Enhanced dropdown interactions
    const dropdowns = document.querySelectorAll('.dropdown-toggle');
    dropdowns.forEach(dropdown => {
        dropdown.addEventListener('show.bs.dropdown', function() {
            this.querySelector('.profile-dropdown-arrow')?.style.setProperty('transform', 'rotate(180deg)');
        });
        
        dropdown.addEventListener('hide.bs.dropdown', function() {
            this.querySelector('.profile-dropdown-arrow')?.style.setProperty('transform', 'rotate(0deg)');
        });
    });

    // Initialize
    fetchNotifications();
    setupWebSocket();
});
</script>
